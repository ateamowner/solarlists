name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://solarlists.com
      - name: Confirm static files
        run: |
          test -f out/CNAME
          test -f out/.nojekyll
          test -f out/googled3ae2edf58b5b2f8.html
          test -f out/57862ecf4b4f3c4df192ffaf4cffbf6e.txt
          test -d out/dayton-oh
          test -d out/dayton-oh/solar-installation
          test "$(tr -d '[:space:]' < out/CNAME)" = "solarlists.com"
          test "$(tr -d '\n' < out/googled3ae2edf58b5b2f8.html)" = "google-site-verification: googled3ae2edf58b5b2f8.html"
          test "$(tr -d '[:space:]' < out/57862ecf4b4f3c4df192ffaf4cffbf6e.txt)" = "57862ecf4b4f3c4df192ffaf4cffbf6e"
          # Slash-canonical sitemap locs (including homepage). Do not revert to no-slash.
          SITEMAP=""
          for candidate in out/sitemap.xml out/sitemap.xml/index.xml out/sitemap.xml/index.html; do
            if [ -f "$candidate" ]; then SITEMAP="$candidate"; break; fi
          done
          test -n "$SITEMAP"
          grep -q '<loc>https://solarlists.com/</loc>' "$SITEMAP"
          ! grep -E '<loc>https://solarlists.com</loc>' "$SITEMAP"
          ! grep -E '<loc>https://solarlists.com/[^<]+[^/]</loc>' "$SITEMAP"
      - uses: actions/upload-artifact@v4
        with:
          name: sitemap-xml
          path: |
            out/sitemap.xml
            out/sitemap.xml/**
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sitemap-xml
          path: out
      - name: Ping IndexNow with sitemap locs
        run: node scripts/ping-indexnow.mjs
